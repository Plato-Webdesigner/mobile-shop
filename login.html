<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به اکانت</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>
    <section class="container">
        <div class="login-top">
            <h1 class="login-title">ورود به اکانت</h1>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="32px" width="32px" fill="#323232de">
                <path
                    d="M12,21V19h7V5H12V3h7q0.83,0 1.41,0.59T21,5V19q0,0.82-0.59,1.41T19,21H12Zm-2-4L8.63,15.55L11.18,13H3V11h8.18L8.63,8.45L10,7l5,5l-5,5Z" />
            </svg>
        </div>
        <form action="#" class="login-form">
            <div class="form-container">
                <label for="user" class="form-label">نام کاربری یا ایمیل:</label>
                <input type="text" class="form-input" name="user" id="user"
                    placeholder="نام کاربری یا ایمیل را وارد کنید">
            </div>
            <div class="form-container">
                <label for="password" class="form-label">رمز عبور:</label>
                <input type="password" class="form-input" name="password" id="password"
                    placeholder="رمز عبور را وارد کنید">
            </div>
            <div class="btn-container">
                <button type="submit" class="submit-btn">ورود</button>
                <button type="reset" class="reset-btn">پاک کردن</button>
            </div>
            <a href="/mobile-shop/register.html" class="form-link">ثبت نام کنید</a>
        </form>
    </section>
</body>

</html>
