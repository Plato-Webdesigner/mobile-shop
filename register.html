<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام</title>
    <link rel="stylesheet" href="./styles/login.css">
</head>

<body>
    <section class="container">
        <div class="login-top">
            <h1 class="login-title">ثبت نام</h1>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="32px" width="32px" fill="#323232de">
                <path
                    d="M9.18,10.83Q8,9.65 8,8T9.18,5.18T12,4t2.83,1.18T16,8t-1.17,2.82T12,12T9.18,10.83ZM4,20V17.2q0-0.85 0.44-1.56q0.44-0.71 1.16-1.09q1.55-0.78 3.15-1.16T12,13t3.25,0.39t3.15,1.16q0.72,0.38 1.16,1.09T20,17.2V20H4Zm2-2H18V17.2q0-0.27-0.14-0.5q-0.14-0.22-0.36-0.35q-1.35-0.68-2.72-1.01T12,15T9.23,15.34T6.5,16.35Q6.28,16.48 6.14,16.7Q6,16.93 6,17.2V18Zm7.41-8.59Q14,8.82 14,8T13.41,6.59T12,6T10.59,6.59Q10,7.18 10,8t0.59,1.41T12,10t1.41-0.59ZM12,8Zm0,10Z" />
            </svg>
        </div>
        <form action="#" class="login-form">
            <div class="form-container">
                <label for="user" class="form-label">نام کاربری:</label>
                <input type="text" class="form-input" name="user" id="user" placeholder="نام کاربری را وارد کنید">
            </div>
            <div class="form-container">
                <label for="email" class="form-label">ایمیل:</label>
                <input type="text" class="form-input" name="email" id="email" placeholder="ایمیل را وارد کنید">
            </div>
            <div class="form-container">
                <label for="password" class="form-label">رمز عبور:</label>
                <input type="password" class="form-input" name="password" id="password"
                    placeholder="رمز عبور را وارد کنید">
            </div>
            <div class="btn-container">
                <button type="submit" class="submit-btn">ثبت نام</button>
                <button type="reset" class="reset-btn">پاک کردن</button>
            </div>
            <a href="/mobile-shop/login.html" class="form-link">وارد شوید</a>
        </form>
    </section>
</body>

</html>
